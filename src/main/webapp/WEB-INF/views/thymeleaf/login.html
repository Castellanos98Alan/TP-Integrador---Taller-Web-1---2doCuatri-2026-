<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Taller Web I</title>

    <!-- Boostrap core css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <!-- Font Awesome (igual que ranking y perfil) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Estilos del login (misma estética que perfil / ranking) -->
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f4f7f6;
            font-family: Arial, Helvetica, sans-serif;
            color: #17332b;
        }

        a {
            text-decoration: none;
        }


        /* NAVBAR */

        .navbar-ranking {
            background-color: #003c2e;
            padding: 12px 35px;
        }

        .marca {
            color: white;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        }

        .marca:hover {
            color: white;
        }

        .marca span {
            color: #50e3a4;
        }


        /* HERO */

        .hero-ranking {
            min-height: 230px;
            padding: 45px;
            color: white;
            background: linear-gradient(
                    90deg,
                    rgba(0, 67, 50, 0.98),
                    rgba(0, 67, 50, 0.78),
                    rgba(0, 67, 50, 0.55)
            );
        }

        .hero-ranking small {
            color: #67e6ad;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .hero-ranking h1 {
            font-size: 45px;
            font-weight: 800;
            margin-top: 10px;
            margin-bottom: 5px;
            overflow-wrap: anywhere;
        }

        .hero-ranking h1 span {
            color: #61e7ae;
        }

        .hero-ranking p {
            font-size: 18px;
            margin-bottom: 5px;
        }


        /* CONTENIDO */

        .contenido-ranking {
            margin-top: -20px;
            background-color: white;
            border-radius: 25px 25px 0 0;
            padding: 30px 20px 50px;
            position: relative;
            min-height: 380px;
        }

        .login-contenedor {
            max-width: 460px;
            margin: 0 auto;
        }


        /* PANEL DEL FORMULARIO */

        .form-panel {
            background-color: #f6f9f8;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 15px;
        }

        .form-panel-titulo {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 3px;
        }

        .form-panel-titulo i {
            color: #006747;
        }

        .form-panel-sub {
            color: #536762;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .campo {
            margin-bottom: 15px;
        }

        .campo label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .campo input {
            width: 100%;
            border: 1px solid #d8e2de;
            border-radius: 6px;
            padding: 9px 10px;
            background-color: white;
            color: #17332b;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .campo input::placeholder {
            color: #9aa8a3;
        }

        .campo input:focus {
            border-color: #006747;
            box-shadow: 0 0 0 3px rgba(0, 103, 71, 0.15);
        }


        /* BOTÓN */

        .boton-crear {
            display: block;
            width: 100%;
            background-color: #ffe600;
            color: #18352c;
            font-weight: bold;
            border-radius: 8px;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            margin-top: 20px;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .boton-crear:hover:not(:disabled) {
            background-color: #f2d900;
            color: #18352c;
            transform: translateY(-1px);
        }

        .boton-crear:disabled {
            background-color: #e9efec;
            color: #9aa8a3;
            cursor: not-allowed;
        }

        .boton-crear:focus-visible {
            outline: 3px solid rgba(0, 103, 71, 0.4);
            outline-offset: 2px;
        }


        /* ERROR */

        .alerta-error {
            margin: 15px 0 0;
            padding: 10px 14px;
            border-radius: 8px;
            background-color: #fdeced;
            border: 1px solid #f5c2c4;
            color: #b3262d;
            font-size: 13px;
            font-weight: bold;
        }


        /* REGISTRO */

        .registro {
            border: 1px solid #e1e9e5;
            border-radius: 12px;
            padding: 15px 20px;
            background-color: white;
            text-align: center;
            color: #536762;
            font-size: 14px;
        }

        .registro a {
            color: #006747;
            font-weight: bold;
            margin-left: 4px;
        }

        .registro a:hover {
            color: #004d38;
        }


        /* FOOTER */

        .footer {
            padding: 20px;
            text-align: center;
            background-color: white;
            color: #536762;
            font-size: 12px;
        }

        .footer span {
            padding: 0 5px;
            color: #22a765;
        }


        /* RESPONSIVE */

        @media (max-width: 900px) {
            .hero-ranking h1 {
                font-size: 35px;
            }

            .hero-ranking {
                padding: 35px 25px;
            }

            .navbar-ranking {
                padding: 12px 20px;
            }
        }

        @media (max-width: 600px) {
            .hero-ranking h1 {
                font-size: 30px;
            }

            .form-panel {
                padding: 20px;
            }
        }
    </style>

</head>

<body>

    <nav class="navbar-ranking">
        <a class="marca" href="#">UNLAM <span>Taller Web I</span></a>
    </nav>

    <header class="hero-ranking">
        <small>BIENVENIDO</small>
        <h1>Iniciar <span>sesión</span></h1>
        <p>Ingresá con tu cuenta para continuar.</p>
    </header>

    <main role="main" class="contenido-ranking">
        <div id="loginbox" class="login-contenedor">

            <form action="#" th:action="@{/validar-login}" method="POST" th:object="${datosLogin}">
                <div class="form-panel">
                    <div class="form-panel-titulo"><i class="fa-solid fa-lock"></i> Taller Web I</div>
                    <div class="form-panel-sub">Completá tus datos de acceso.</div>

                    <div class="campo">
                        <label for="email">Email</label>
                        <input th:field="*{email}" id="email" type="email" placeholder="tu@email.com"
                            autocomplete="email" required />
                    </div>

                    <div class="campo">
                        <label for="password">Contraseña</label>
                        <input th:field="*{password}" type="password" id="password" placeholder="Tu contraseña"
                            autocomplete="current-password" required />
                    </div>

                    <button id="btn-login" class="boton-crear" type="submit" disabled>Ingresar</button>

                    <p th:if="${error != null}" class="alerta-error" th:text="'Error ' + ${error}"></p>
                </div>
            </form>

            <div class="registro">
                ¿No tenés cuenta?
                <a id="btn-register" href="nuevo-usuario">Registrarme</a>
            </div>

        </div>
    </main>

    <footer class="footer">
        UNLAM <span>●</span> Taller Web I
    </footer>

    <!-- Boostrap core js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>

    <script type="module" th:src="@{js/login.js}"></script>
</body>

</html>
