```html
<form action="#" th:action="@{/registrarme}" method="POST" th:object="${usuario}">
  <h3 class="form-signin-heading">Nuevo Usuario</h3>
  <hr class="colorgraph">

  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input th:field="*{email}" type="email" id="email"
           class="form-control" required />
  </div>

  <div class="mb-3">
    <label for="password" class="form-label">Contraseña</label>
    <input th:field="*{password}" type="password" id="password"
           class="form-control" required />
  </div>

  <div class="mb-3">
    <label for="nickname" class="form-label">Nickname</label>
    <input th:field="*{nickname}" type="text" id="nickname"
           class="form-control" required />
  </div>

  <div class="mb-3">
    <label for="zona" class="form-label">Zona</label>
    <input th:field="*{zona}" type="text" id="zona"
           class="form-control" required />
  </div>

  <div class="mb-3">
    <label for="posicion1" class="form-label">Posición principal</label>
    <select id="posicion1" name="posicion1"
            class="form-select" required>
      <option value="">Seleccioná tu posición</option>
      <option value="Arquero">Arquero</option>
      <option value="Defensor">Defensor</option>
      <option value="Mediocampista">Mediocampista</option>
      <option value="Delantero">Delantero</option>
      <option value="Polifuncional">Polifuncional</option>
    </select>
  </div>

  <div class="mb-3">
    <label for="posicion2" class="form-label">
      Posición secundaria (opcional)
    </label>
    <select id="posicion2" name="posicion2" class="form-select">
      <option value="">Sin posición secundaria</option>
      <option value="Arquero">Arquero</option>
      <option value="Defensor">Defensor</option>
      <option value="Mediocampista">Mediocampista</option>
      <option value="Delantero">Delantero</option>
      <option value="Polifuncional">Polifuncional</option>
    </select>
  </div>

  <div class="mb-3">
    <label for="dni" class="form-label">DNI</label>
    <input type="text" id="dni" name="dni"
           class="form-control"
           inputmode="numeric"
           pattern="[0-9]{7,8}"
           maxlength="8"
           title="Ingresá un DNI de 7 u 8 números"
           required />
  </div>

  <button id="btn-registrarme"
          class="btn btn-lg btn-primary btn-block"
          type="submit">
    Registrarme
  </button>

  <p th:if="${error != null}"
     class="alert alert-danger"
     th:text="'Error ' + ${error}">
  </p>
</form>
```
