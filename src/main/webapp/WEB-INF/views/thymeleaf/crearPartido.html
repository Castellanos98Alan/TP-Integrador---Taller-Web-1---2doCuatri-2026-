<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArmoLaCancha - Crear Partido</title>
    <link rel="stylesheet" th:href="@{/resources/core/css/main.css}">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #10b981;
            --primary-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --error-bg: #451a1a;
            --error-border: #f87171;
            --error-text: #fca5a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            margin-left: 1.5rem;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--text-main);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2.5rem 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            margin-bottom: 1.5rem;
        }

        .card-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 0.25rem;
        }

        .card-header p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .alert-error {
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        input[type="text"],
        input[type="datetime-local"],
        input[type="number"],
        select {
            width: 100%;
            padding: 0.65rem 0.85rem;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.75rem;
            align-items: center;
        }

        .btn-submit {
            flex: 2;
            background-color: var(--primary);
            color: #022c22;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-cancel {
            flex: 1;
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.75rem;
            border-radius: 6px;
            transition: background-color 0.2s, color 0.2s;
        }

        .btn-cancel:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }
    </style>
</head>
<body>

<header>
    <a th:href="@{/home}" class="logo">ArmoLaCancha</a>
    <nav>
        <a th:href="@{/home}">Inicio</a>
        <a th:href="@{/partidos}">Ver Partidos</a>
    </nav>
</header>

<main>
    <div class="card">
        <div class="card-header">
            <h2>Organizar Partido</h2>
            <p>Configura las condiciones y abre la convocatoria.</p>
        </div>


        <div th:if="${error}" class="alert-error">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/crearPartido}" th:object="${datosPartido}" method="post">
            <div class="form-group">
                <label for="cancha">Lugar / Cancha</label>
                <input type="text" id="cancha" th:field="*{cancha}" placeholder="Ej: Club Nahuel - Cancha 1" required />
            </div>

            <div class="form-group">
                <label for="fechaHora">Fecha y Hora</label>
                <input type="datetime-local" id="fechaHora" th:field="*{fechaHora}" required />
            </div>

            <div class="form-group">
                <label for="cupo">Cupo de Jugadores</label>
                <input type="number" id="cupo" th:field="*{cupo}" min="2" max="22" placeholder="Ej: 10" required />
            </div>

            <div class="form-group">
                <label for="nivel">Nivel del Partido</label>
                <select id="nivel" th:field="*{nivel}">
                    <option value="PRINCIPIANTE">Principiante</option>
                    <option value="INTERMEDIO">Intermedio</option>
                    <option value="AVANZADO">Avanzado</option>
                </select>
            </div>

            <div class="actions">
                <button type="submit" class="btn-submit">Publicar Partido</button>
                <a th:href="@{/home}" class="btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
