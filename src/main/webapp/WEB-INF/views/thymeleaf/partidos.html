<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Buscar Partidos - ArmoLaCancha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Encontrar Partidos</h2>

        <!-- Mostrar errores si existen -->
        <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Filtros -->
    <form th:action="@{/partidos}" method="GET" class="mb-4 bg-light p-3 rounded shadow-sm">
        <div class="row g-2 align-items-end">
            
            <!-- Filtro 1: Nivel (Rango) -->
            <div class="col-md-4 col-lg-2">
                <label for="filtroNivel" class="form-label small fw-bold mb-1">Rango mínimo</label>
                <select name="filtroNivel" id="filtroNivel" class="form-select form-select-sm">
                    <option value="TODOS">Cualquier rango</option>
                    <option value="PRINCIPIANTE">Principiante</option>
                    <option value="INTERMEDIO">Intermedio</option>
                    <option value="AVANZADO">Avanzado</option>
                </select>
            </div>

            <!-- Filtro 2: Distancia -->
            <div class="col-md-4 col-lg-2">
                <label for="filtroDistancia" class="form-label small fw-bold mb-1">Distancia máx.</label>
                <select name="filtroDistancia" id="filtroDistancia" class="form-select form-select-sm">
                    <option value="TODOS">Cualquiera</option>
                    <option value="3">Hasta 3 km</option>
                    <option value="5">Hasta 5 km</option>
                    <option value="10">Hasta 10 km</option>
                </select>
            </div>

            <!-- Filtro 3: Tipo de partido -->
            <div class="col-md-4 col-lg-2">
                <label for="filtroTipo" class="form-label small fw-bold mb-1">Tipo de partido</label>
                <select name="filtroTipo" id="filtroTipo" class="form-select form-select-sm">
                    <option value="TODOS">Todos</option>
                    <option value="PUBLICO">Público</option>
                    <option value="PRIVADO">Privado</option>
                </select>
            </div>

            <!-- Filtro 4: Jugadores -->
            <div class="col-md-4 col-lg-2">
                <label for="filtroJugadores" class="form-label small fw-bold mb-1">Jugadores</label>
                <select name="filtroJugadores" id="filtroJugadores" class="form-select form-select-sm">
                    <option value="">Cualquiera</option>
                    <option value="10">Fútbol 5 (10)</option>
                    <option value="14">Fútbol 7 (14)</option>
                    <option value="22">Fútbol 11 (22)</option>
                </select>
            </div>

            <!-- Filtro 5: Fecha -->
            <div class="col-md-4 col-lg-2">
                <label for="filtroFecha" class="form-label small fw-bold mb-1">Fecha</label>
                <select name="filtroFecha" id="filtroFecha" class="form-select form-select-sm">
                    <option value="TODOS">Cualquier día</option>
                    <option value="2026-10-02">2 Octubre</option>
                    <option value="2026-10-03">3 Octubre</option>
                    <option value="2026-10-04">4 Octubre</option>
                </select>
            </div>

            <!-- Filtro 6: Horario (NUEVO) -->
            <div class="col-md-4 col-lg-2">
                <label for="filtroHora" class="form-label small fw-bold mb-1">Horario</label>
                <select name="filtroHora" id="filtroHora" class="form-select form-select-sm">
                    <option value="TODOS">Cualquier horario</option>
                    <option value="14:30">14:30 hs</option>
                    <option value="18:00">18:00 hs</option>
                    <option value="20:00">20:00 hs</option>
                </select>
            </div>

            <!-- Botón de Filtrar (Nueva fila) -->
            <div class="col-12 mt-3 text-end">
                <button type="submit" class="btn btn-success btn-sm px-4">Aplicar Filtros</button>
            </div>

        </div>
    </form>

       <!-- Grilla de Partidos -->
    <div class="row">
        <div th:each="partido : ${listaPartidos}" class="col-md-4 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex flex-column">
                    
                    <!-- Título de la Cancha -->
                    <h5 class="card-title text-success fw-bold mb-3" th:text="${partido.cancha.nombre}">Cancha Defecto</h5>
                    
                    <!-- Datos del Partido -->
                    <div class="card-text mb-3 text-secondary">
                        <!-- Separamos el LocalDateTime en Fecha y Hora -->
                        <strong>Fecha:</strong> <span th:text="${#temporals.format(partido.fecha, 'dd/MM/yyyy')}"></span><br>
                        <strong>Hora:</strong> <span th:text="${#temporals.format(partido.fecha, 'HH:mm')} + ' hs'"></span><br>
                        
                        <!-- Nueva variable de Distancia -->
                        <strong>Distancia:</strong> a <span th:text="${partido.distanciaKm}"></span> km<br>
                        
                        <strong>Nivel:</strong> <span th:text="${partido.nivel}"></span><br>
                        
                        <strong>Cupo:</strong> <span th:text="${partido.confirmados.size()} + '/' + ${partido.cupoMaximo}"></span>
                    </div>
                    
                    <!-- Etiqueta Privado/Público -->
                    <div class="mb-3">
                        <span th:if="${partido.esPrivado}" class="badge bg-warning text-dark">Privado</span>
                        <span th:unless="${partido.esPrivado}" class="badge bg-success">Público</span>
                    </div>

                    <!-- Formulario para Unirse (mt-auto empuja el botón siempre al fondo de la tarjeta) -->
                    <form th:action="@{/partidos/unirse}" method="POST" class="mt-auto">
                        <input type="hidden" name="partidoId" th:value="${partido.id}">
                        
                        <!-- Solo se muestra el input de código si el partido es privado -->
                        <div th:if="${partido.esPrivado}" class="mb-2">
                            <input type="text" name="codigoAcceso" class="form-control form-control-sm" placeholder="Código de acceso" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Confirmar Asistencia</button>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
    </div>
</body>
</html>
