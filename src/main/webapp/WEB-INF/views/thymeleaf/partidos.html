<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encontrar Partidos - ArmoLaCancha</title>

    <!-- Bootstrap y FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            background-color: #f4f7f6;
            font-family: Arial, Helvetica, sans-serif;
            color: #17332b;
        }

        /* NAVBAR */
        .navbar-principal {
            background-color: #003c2e;
            padding: 12px 35px;
        }
        .marca {
            color: white;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        }
        .marca span { color: #50e3a4; }
        .nav-link {
            color: white !important;
            margin: 0 10px;
        }
        .nav-link.active {
            color: #ffe600 !important;
            border-bottom: 3px solid #ffe600;
        }
        .boton-crear {
            background-color: #ffe600;
            color: #18352c;
            font-weight: bold;
            border-radius: 8px;
            padding: 10px 20px;
            text-decoration: none;
        }

        /* HERO */
        .hero-seccion {
            min-height: 230px;
            padding: 45px;
            color: white;
            background: linear-gradient(90deg, rgba(0, 67, 50, 0.98), rgba(0, 67, 50, 0.78), rgba(0, 67, 50, 0.55));
        }
        .hero-seccion small {
            color: #67e6ad;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .hero-seccion h1 {
            font-size: 45px;
            font-weight: 800;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        .hero-seccion h1 span { color: #61e7ae; }
        .hero-seccion p {
            font-size: 18px;
            margin-bottom: 5px;
        }

        /* CONTENIDO PRINCIPAL */
        .contenido-principal {
            margin-top: -20px;
            background-color: white;
            border-radius: 25px 25px 0 0;
            padding: 30px;
            min-height: 500px;
        }

        /* FILTROS (Adaptados al diseño del equipo) */
        .filtros-busqueda {
            background-color: #f6f9f8;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #e3ece8;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-principal">
    <div class="container-fluid">
        <a class="marca" th:href="@{/home}">
            <i class="fa-solid fa-futbol"></i> ArmoLaCancha
        </a>
        <div class="navbar-nav ms-auto me-auto">
            <a class="nav-link" th:href="@{/home}">Inicio</a>
            <!-- Pestaña activa -->
            <a class="nav-link active" th:href="@{/partidos}">Partidos</a>
            <a class="nav-link" th:href="@{/ranking}">Ranking</a>
            <a class="nav-link" th:href="@{/perfil}">Mi Perfil</a>
        </div>
        <a class="boton-crear" th:href="@{/crearPartido}">＋ Crear partido</a>
    </div>
</nav>

<!-- HERO -->
<section class="hero-seccion">
    <small>MÁS FÚTBOL. MÁS AMIGOS. MENOS LÍO.</small>
    <h1>PARTIDOS <span>CERCA TUYO</span></h1>
    <p>Encontrá partidos, unite y viví el fútbol amateur como debe ser.</p>
</section>

<!-- CONTENIDO PRINCIPAL SUPERPUESTO -->
<div class="container-fluid contenido-principal">
    <div class="row justify-content-center">
        <div class="col-lg-11">

            <!-- FORMULARIO DE FILTROS -->
            <div class="filtros-busqueda shadow-sm">
            <form th:action="@{/partidos}" method="GET">
                <div class="row g-3 align-items-end">
                    
                    <div class="col-md-4 col-lg-2">
                        <label for="filtroNivel" class="form-label small fw-bold mb-1">Rango mínimo</label>
                        <select name="filtroNivel" id="filtroNivel" class="form-select form-select-sm">
                            <option value="TODOS" th:selected="${nivelSeleccionado == null or nivelSeleccionado == 'TODOS'}">Cualquier rango</option>
                            <option value="PRINCIPIANTE" th:selected="${nivelSeleccionado == 'PRINCIPIANTE'}">Principiante</option>
                            <option value="INTERMEDIO" th:selected="${nivelSeleccionado == 'INTERMEDIO'}">Intermedio</option>
                            <option value="AVANZADO" th:selected="${nivelSeleccionado == 'AVANZADO'}">Avanzado</option>
                        </select>
                    </div>

                    <!-- Filtro Provincia -->
                    <div class="col-md-4 col-lg-2">
                        <label for="filtroProvincia" class="form-label small fw-bold mb-1">Provincia</label>
                        <select name="filtroProvincia" id="filtroProvincia" class="form-select form-select-sm">
                            <option value="TODOS" th:selected="${provinciaSeleccionada == null or provinciaSeleccionada == 'TODOS'}">Cualquiera</option>
                            <option th:each="prov : ${provinciasDisponibles}" 
                                    th:value="${prov}" 
                                    th:text="${prov}"
                                    th:selected="${provinciaSeleccionada == prov}">
                            </option>
                        </select>
                    </div>

                    <!-- Filtro Localidad -->
                    <div class="col-md-4 col-lg-2">
                        <label for="filtroLocalidad" class="form-label small fw-bold mb-1">Localidad</label>
                        <select name="filtroLocalidad" id="filtroLocalidad" class="form-select form-select-sm">
                            <option value="TODOS" th:selected="${localidadSeleccionada == null or localidadSeleccionada == 'TODOS'}">Cualquiera</option>
                            <option th:each="loc : ${localidadesDisponibles}" 
                                    th:value="${loc}" 
                                    th:text="${loc}"
                                    th:selected="${localidadSeleccionada == loc}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-4 col-lg-2">
                        <label for="filtroTipo" class="form-label small fw-bold mb-1">Tipo de partido</label>
                        <select name="filtroTipo" id="filtroTipo" class="form-select form-select-sm">
                            <option value="TODOS" th:selected="${tipoSeleccionado == null or tipoSeleccionado == 'TODOS'}">Todos</option>
                            <option value="PUBLICO" th:selected="${tipoSeleccionado == 'PUBLICO'}">Público</option>
                            <option value="PRIVADO" th:selected="${tipoSeleccionado == 'PRIVADO'}">Privado</option>
                        </select>
                    </div>

                    <div class="col-md-4 col-lg-2">
                        <label for="filtroCupo" class="form-label small fw-bold mb-1">Jugadores</label>
                        <select name="filtroCupo" id="filtroCupo" class="form-select form-select-sm">
                            <option value="TODOS" th:selected="${cupoSeleccionado == null or cupoSeleccionado == 'TODOS'}">Cualquiera</option>
                            <option th:each="cupo : ${cuposDisponibles}" 
                                    th:value="${cupo}" 
                                    th:text="|Fútbol de ${cupo}|"
                                    th:selected="${cupoSeleccionado == cupo.toString()}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-4 col-lg-2">
                        <label for="filtroFecha" class="form-label small fw-bold mb-1">Fecha</label>
                        <select name="filtroFecha" id="filtroFecha" class="form-select form-select-sm">
                            <option value="TODOS" th:selected="${fechaSeleccionada == null or fechaSeleccionada == 'TODOS'}">Cualquier día</option>
                            <option th:each="fecha : ${fechasDisponibles}" 
                                    th:value="${fecha}" 
                                    th:text="${fecha}"
                                    th:selected="${fechaSeleccionada == fecha}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-4 col-lg-2">
                        <label for="filtroHora" class="form-label small fw-bold mb-1">Horario</label>
                        <select name="filtroHora" id="filtroHora" class="form-select form-select-sm">
                            <option value="TODOS" th:selected="${horaSeleccionada == null or horaSeleccionada == 'TODOS'}">Cualquier horario</option>
                            <option th:each="hora : ${horasDisponibles}" 
                                    th:value="${hora}" 
                                    th:text="|${hora} hs|"
                                    th:selected="${horaSeleccionada == hora}">
                            </option>
                        </select>
                    </div>

                    <div class="col-12 mt-3 text-end">
                        <button type="submit" class="btn btn-success btn-sm px-4 fw-bold">Aplicar Filtros</button>
                    </div>
                </div>
            </form>
            </div>

            <!-- GRILLA DE PARTIDOS -->
            <div class="row">
                <!-- Mensaje si no hay partidos -->
                <div th:if="${listaPartidos == null or listaPartidos.isEmpty()}" class="col-12 text-center py-5">
                    <h4 class="text-muted"><i class="fa-solid fa-futbol"></i> No se encontraron partidos con esos filtros</h4>
                </div>

                <!-- Tarjetas -->
                <div th:each="partido : ${listaPartidos}" class="col-md-6 col-lg-4 mb-4">
                    <div class="card shadow-sm h-100 border-0" style="border: 1px solid #e3ece8 !important;">
                        <div class="card-body d-flex flex-column">
                            
                            <h5 class="card-title text-success fw-bold mb-3" th:text="${partido.cancha.nombre}">Cancha</h5>
                            
                            <div class="card-text mb-3 text-secondary" style="font-size: 14px;">
                                <strong><i class="fa-regular fa-calendar"></i> Fecha:</strong> <span th:text="${#temporals.format(partido.fecha, 'dd/MM/yyyy')}"></span><br>
                                <strong><i class="fa-regular fa-clock"></i> Hora:</strong> <span th:text="${#temporals.format(partido.fecha, 'HH:mm')} + ' hs'"></span><br>
                                <strong><i class="fa-solid fa-location-dot"></i> Ubicación:</strong> <span th:text="${partido.cancha.localidad + ', ' + partido.cancha.provincia}"></span><br>
                                <strong><i class="fa-solid fa-ranking-star"></i> Nivel:</strong> <span th:text="${partido.nivel}"></span><br>
                                <strong><i class="fa-solid fa-users"></i> Cupo:</strong> <span th:text="${partido.confirmados.size()} + '/' + ${partido.cupoMaximo}"></span>
                            </div>
                            
                            <div class="mb-3">
                                <span th:if="${partido.esPrivado}" class="badge bg-warning text-dark"><i class="fa-solid fa-lock"></i> Privado</span>
                                <span th:unless="${partido.esPrivado}" class="badge bg-success"><i class="fa-solid fa-lock-open"></i> Público</span>
                            </div>

                            <div class="mt-auto">
                                <a th:href="@{/partido/{id}/sala-de-espera(id=${partido.id})}" class="btn btn-outline-success w-100 fw-bold">
                                    Unirme <i class="fa-solid fa-arrow-right"></i>
                                </a>
                            </div>
                                
                                <div th:if="${partido.esPrivado}" class="mb-2">
                                    <input type="text" name="codigoAcceso" class="form-control form-control-sm" placeholder="Código de acceso" required>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
